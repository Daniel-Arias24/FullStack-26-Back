spring.application.name=FullStack-26-Back
server.port=8080

#  Base de datos H2 (desarrollo)
# H2 corre en memoria; los datos se pierden al reiniciar (ideal para dev)
spring.datasource.url=jdbc:h2:mem:espritdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#  Consola H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#  JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: crea las tablas al iniciar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  Deshabilitar Spring Security (usamos BCrypt manualmente)
# Sin esto, Spring Security pide usuario/contraseña en cada request
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

